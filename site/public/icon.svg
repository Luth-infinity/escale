<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb3a9"/>
      <stop offset="1" stop-color="#007a74"/>
    </linearGradient>
  </defs>
  <!-- Socle vert d'eau, l'accent d'Escale : rien à voir avec le noir de Hublink. -->
  <rect x="20" y="20" width="984" height="984" rx="225" fill="url(#fond)"/>
  <!-- Une route et ses escales ; celle où l'on est, pleine. Se lit aussi comme
       des onglets empilés. -->
  <rect x="487" y="340" width="50" height="344" fill="#fff" opacity=".45"/>
  <circle cx="512" cy="282" r="64" fill="none" stroke="#fff" stroke-width="40"/>
  <circle cx="512" cy="512" r="104" fill="#fff"/>
  <circle cx="512" cy="742" r="64" fill="none" stroke="#fff" stroke-width="40"/>
</svg>
